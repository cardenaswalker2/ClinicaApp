<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atención Médica | ClínicaApp</title>
    <link th:replace="~{fragments/header :: favIcon}">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;
            --dark: #0f172a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.1);
            --shadow-xl: 0 16px 40px rgba(15, 23, 42, 0.12);
            --shadow-primary: 0 8px 24px rgba(79, 70, 229, 0.18);
            --shadow-success: 0 8px 24px rgba(16, 185, 129, 0.18);
            --shadow-info: 0 8px 24px rgba(14, 165, 233, 0.18);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--gray-50);
            min-height: 100vh;
            color: var(--gray-700);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: linear-gradient(135deg, var(--gray-900) 0%, #1e1b4b 100%) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
        }

        .navbar .container {
            padding-top: 0.875rem;
            padding-bottom: 0.875rem;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .navbar-brand i {
            background: linear-gradient(135deg, #38bdf8, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.3rem;
        }

        .btn-back {
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: none;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            color: white;
            transform: translateY(-1px);
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            max-width: 900px;
            margin: 0 auto;
            animation: slideUp 0.5s ease forwards;
            opacity: 0;
            animation-delay: 0.1s;
        }

        .form-header {
            padding: 1.5rem 1.75rem;
            border-bottom: 1px solid var(--gray-100);
            background: linear-gradient(135deg, #fafafa, #f8f9fa);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .form-header h5 {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .form-header h5 i {
            background: linear-gradient(135deg, var(--info), #0284c7);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }

        .form-header .patient-name {
            background: linear-gradient(135deg, var(--info), #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .badge-services {
            background: rgba(14, 165, 233, 0.08);
            color: var(--info);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1.5px solid rgba(14, 165, 233, 0.12);
            white-space: nowrap;
        }

        .badge-services i {
            margin-right: 0.375rem;
        }

        .form-body {
            padding: 1.75rem;
        }

        /* ===== SECTION HEADERS ===== */
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.75rem 0 1.25rem 0;
            padding-bottom: 0.75rem;
            border-bottom: 1.5px solid var(--gray-100);
        }

        .section-header:first-of-type {
            margin-top: 0;
        }

        .section-number {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--gray-800), var(--gray-600));
            color: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .section-header h6 {
            font-size: 1rem;
            font-weight: 800;
            color: var(--gray-800);
            margin: 0;
            letter-spacing: -0.01em;
        }

        /* ===== VITALS GRID ===== */
        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .vital-card {
            background: var(--gray-50);
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 1rem;
            text-align: center;
            transition: var(--transition);
        }

        .vital-card:hover {
            border-color: var(--info);
            background: white;
            box-shadow: var(--shadow-sm);
        }

        .vital-icon {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .vital-icon.peso {
            color: var(--primary);
        }

        .vital-icon.temp {
            color: var(--danger);
        }

        .vital-icon.cardiaca {
            color: var(--success);
        }

        .vital-icon.respiratoria {
            color: var(--info);
        }

        .vital-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .vital-input-group {
            display: flex;
            align-items: center;
            background: white;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .vital-input-group:focus-within {
            border-color: var(--info);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        .vital-input {
            border: none;
            padding: 0.625rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--gray-800);
            text-align: center;
            width: 100%;
            outline: none;
            background: transparent;
        }

        .vital-input::placeholder {
            color: var(--gray-400);
            font-weight: 500;
        }

        .vital-unit {
            background: var(--gray-100);
            padding: 0.625rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--gray-500);
            border-left: 1.5px solid var(--gray-200);
            white-space: nowrap;
        }

        /* ===== FORM CONTROLS ===== */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-label-custom {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .form-label-custom i {
            color: var(--info);
            font-size: 0.875rem;
        }

        .form-control-custom {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--gray-800);
            background: var(--gray-50);
            transition: var(--transition);
            outline: none;
        }

        .form-control-custom:hover {
            border-color: var(--gray-300);
        }

        .form-control-custom:focus {
            border-color: var(--info);
            background: white;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        textarea.form-control-custom {
            resize: vertical;
            min-height: 80px;
        }

        .select-custom {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--gray-800);
            background: var(--gray-50);
            transition: var(--transition);
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 14px;
            padding-right: 2.5rem;
        }

        .select-custom:hover {
            border-color: var(--gray-300);
        }

        .select-custom:focus {
            border-color: var(--info);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }

        /* Price Input */
        .price-input-group {
            display: flex;
            align-items: center;
            background: var(--gray-50);
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .price-input-group:focus-within {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            background: white;
        }

        .price-prefix {
            padding: 0.875rem 1rem;
            font-weight: 800;
            color: var(--success);
            font-size: 1rem;
            border-right: 1.5px solid var(--gray-200);
            background: var(--gray-100);
        }

        .price-input {
            border: none;
            padding: 0.875rem 1rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--gray-800);
            width: 100%;
            outline: none;
            background: transparent;
        }

        /* ===== SUBMIT BUTTON ===== */
        .form-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1.5px solid var(--gray-100);
            display: flex;
            justify-content: flex-end;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            padding: 1rem 2.5rem;
            font-weight: 800;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-success);
            cursor: pointer;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(16, 185, 129, 0.3);
        }

        .btn-submit i {
            font-size: 1.1rem;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 991.98px) {
            .vitals-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 575.98px) {
            .form-header {
                padding: 1.25rem;
            }

            .form-body {
                padding: 1.25rem;
            }

            .vitals-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.625rem;
            }

            .vital-card {
                padding: 0.75rem;
            }

            .btn-submit {
                width: 100%;
                justify-content: center;
            }

            .form-footer {
                justify-content: center;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand">
                <i class="bi bi-heart-pulse-fill"></i>
                Registro de Atención Médica
            </span>
            <a th:href="@{/clinica/citas}" class="btn-back">
                <i class="bi bi-arrow-left"></i>
                <span class="d-none d-sm-inline">Salir sin guardar</span>
            </a>
        </div>
    </nav>

    <div class="container mt-4 pb-5">

        <!-- Form Card -->
        <div class="form-card">
            <!-- Header -->
            <div class="form-header">
                <h5>
                    <i class="bi bi-file-earmark-medical"></i>
                    Paciente: <span class="patient-name" th:text="${nombreMascota}">Nombre Mascota</span>
                </h5>
                <div class="badge-services">
                    <i class="bi bi-layers-fill"></i>
                    Servicios: <span th:text="${serviciosSolicitados}">--</span>
                </div>
            </div>

            <!-- Body -->
            <div class="form-body">
                <form th:action="@{/clinica/visitas/guardar}" th:object="${visitaDTO}" method="post">

                    <!-- Campos ocultos -->
                    <input type="hidden" th:field="*{citaId}" />
                    <input type="hidden" th:field="*{mascotaId}" />
                    <input type="hidden" th:field="*{clinicaId}" />

                    <!-- SECCIÓN 1: CONSTANTES VITALES -->
                    <div class="section-header">
                        <div class="section-number">1</div>
                        <h6>Constantes Vitales y Triaje</h6>
                    </div>

                    <div class="vitals-grid">
                        <div class="vital-card">
                            <i class="bi bi-speedometer2 vital-icon peso"></i>
                            <span class="vital-label">Peso</span>
                            <div class="vital-input-group">
                                <input type="number" step="0.1" class="vital-input" th:field="*{peso}"
                                    placeholder="0.0">
                                <span class="vital-unit">kg</span>
                            </div>
                        </div>
                        <div class="vital-card">
                            <i class="bi bi-thermometer-half vital-icon temp"></i>
                            <span class="vital-label">Temperatura</span>
                            <div class="vital-input-group">
                                <input type="number" step="0.1" class="vital-input" th:field="*{temperatura}"
                                    placeholder="38.0">
                                <span class="vital-unit">°C</span>
                            </div>
                        </div>
                        <div class="vital-card">
                            <i class="bi bi-heart-pulse vital-icon cardiaca"></i>
                            <span class="vital-label">Frec. Cardiaca</span>
                            <div class="vital-input-group">
                                <input type="number" class="vital-input" th:field="*{frecuenciaCardiaca}"
                                    placeholder="80">
                                <span class="vital-unit">bpm</span>
                            </div>
                        </div>
                        <div class="vital-card">
                            <i class="bi bi-wind vital-icon respiratoria"></i>
                            <span class="vital-label">Frec. Respiratoria</span>
                            <div class="vital-input-group">
                                <input type="number" class="vital-input" th:field="*{frecuenciaRespiratoria}"
                                    placeholder="20">
                                <span class="vital-unit">rpm</span>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 2: EVALUACIÓN FÍSICA -->
                    <div class="section-header">
                        <div class="section-number">2</div>
                        <h6>Evaluación Física General</h6>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-custom">Estado de Conciencia</label>
                                <select class="select-custom" th:field="*{estadoConciencia}">
                                    <option value="Alerta">Alerta</option>
                                    <option value="Deprimido">Deprimido</option>
                                    <option value="Estuporoso">Estuporoso</option>
                                    <option value="Comatoso">Comatoso</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-custom">Condición Corporal</label>
                                <select class="select-custom" th:field="*{condicionCorporal}">
                                    <option value="1/5 (Delgadez extrema)">1/5 (Delgadez extrema)</option>
                                    <option value="2/5 (Bajo peso)">2/5 (Bajo peso)</option>
                                    <option value="3/5 (Ideal)">3/5 (Ideal)</option>
                                    <option value="4/5 (Sobrepeso)">4/5 (Sobrepeso)</option>
                                    <option value="5/5 (Obeso)">5/5 (Obeso)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN 3: DIAGNÓSTICO -->
                    <div class="section-header">
                        <div class="section-number">3</div>
                        <h6>Hallazgos y Diagnóstico</h6>
                    </div>

                    <div class="form-group">
                        <label class="form-label-custom">Diagnóstico Médico</label>
                        <textarea class="form-control-custom" th:field="*{diagnostico}" rows="3"
                            placeholder="Describa el estado del paciente y hallazgos clínicos..." required></textarea>
                    </div>

                    <!-- SECCIÓN 4: TRATAMIENTO Y RECETA -->
                    <div class="section-header">
                        <div class="section-number">4</div>
                        <h6>Tratamiento y Receta</h6>
                    </div>

                    <div class="form-group">
                        <label class="form-label-custom">Procedimientos Realizados</label>
                        <textarea class="form-control-custom" th:field="*{tratamiento}" rows="2"
                            placeholder="Ej: Limpieza de herida, aplicación de suero..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label-custom">Medicamentos Recetados (Opcional)</label>
                        <textarea class="form-control-custom" th:field="*{medicamentosRecetados}" rows="2"
                            placeholder="Nombre del medicamento, dosis y frecuencia..."></textarea>
                    </div>

                    <!-- SECCIÓN 5: SEGUIMIENTO Y CIERRE -->
                    <div class="section-header">
                        <div class="section-number">5</div>
                        <h6>Seguimiento y Cierre</h6>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-custom">
                                    <i class="bi bi-calendar-check"></i>
                                    Programar Próxima Cita
                                </label>
                                <input type="datetime-local" class="form-control-custom" th:field="*{fechaProximaCita}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="form-label-custom">
                                    <i class="bi bi-cash-coin"></i>
                                    Cargos Adicionales (USD)
                                </label>
                                <div class="price-input-group">
                                    <span class="price-prefix">$</span>
                                    <input type="number" step="0.1" class="price-input" th:field="*{costoTotal}"
                                        required>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <label class="form-label-custom">Instrucciones para el dueño</label>
                                <textarea class="form-control-custom" th:field="*{notasAdicionales}" rows="2"
                                    placeholder="Ej: Dieta blanda por 48h, evitar contacto con otros perros..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Footer / Submit -->
                    <div class="form-footer">
                        <button type="submit" class="btn-submit">
                            <i class="bi bi-cloud-check"></i>
                            Finalizar Historia Clínica
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
