<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardar Empleado | Panel Clínica</title>
    <link th:replace="~{fragments/header :: favIcon}">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --radius-md: 12px;
            --radius-xl: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--gray-50);
            min-height: 100vh;
            color: var(--gray-700);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, var(--gray-900) 0%, #1e1b4b 100%) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.875rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .navbar-brand i {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-back {
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            border-radius: var(--radius-md);
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
            transform: translateY(-1px);
        }

        .form-card {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--gray-200);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            padding: 2rem;
            margin-top: 2rem;
            margin-bottom: 3rem;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.825rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray-500);
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--gray-200);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .section-title {
            font-weight: 800;
            font-size: 1rem;
            color: var(--dark);
            border-bottom: 1.5px dashed var(--gray-200);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .day-checkbox {
            display: none;
        }

        .day-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border: 1.5px solid var(--gray-200);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--gray-600);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .day-checkbox:checked + .day-label {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: var(--radius-md);
            border: none;
            transition: var(--transition);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-cancel {
            background: var(--gray-100);
            color: var(--gray-600);
            font-weight: 700;
            padding: 0.75rem 2rem;
            border-radius: var(--radius-md);
            border: none;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancel:hover {
            background: var(--gray-200);
            color: var(--gray-800);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/clinica/dashboard}">
                <i class="bi bi-shield-plus"></i>
                ClínicaApp <span>Admin Sede</span>
            </a>
            <div class="ms-auto">
                <a class="btn-back" th:href="@{/clinica/personal}">
                    <i class="bi bi-arrow-left"></i>
                    Cancelar y Volver
                </a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        <div class="form-card">
            <h4 class="fw-bold mb-4" th:text="${empleadoDto.id != null ? '📝 Editar Colaborador' : '👤 Nuevo Colaborador'}">Datos de Colaborador</h4>

            <form th:action="@{/clinica/personal/guardar}" th:object="${empleadoDto}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="section-title">
                    <i class="bi bi-person-bounding-box text-primary"></i>
                    Información Básica
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required placeholder="Ej: Juan" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" th:field="*{apellido}" required placeholder="Ej: Pérez" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" th:field="*{email}" required placeholder="Ej: juan.perez@clinica.com" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}" required placeholder="Ej: +57 300 123 4567" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" th:text="${empleadoDto.id != null ? 'Contraseña (Dejar en blanco para conservar)' : 'Contraseña'}">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" th:required="${empleadoDto.id == null}" placeholder="Mínimo 6 caracteres" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Rol / Cargo</label>
                        <select class="form-select" th:field="*{role}" required>
                            <option value="" disabled selected>Selecciona un rol...</option>
                            <option th:each="r : ${rolesDisponibles}" th:value="${r}" 
                                    th:text="${#strings.replace(r.name(), 'ROLE_', '')}">ROL</option>
                        </select>
                    </div>
                </div>

                <div class="section-title">
                    <i class="bi bi-calendar-range text-primary"></i>
                    Horario de Trabajo y Disponibilidad
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Días Laborales</label>
                    <div class="d-flex flex-wrap gap-2 mt-1">
                        <th:block th:each="dia : ${T(java.util.Arrays).asList('LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES', 'SABADO', 'DOMINGO')}">
                            <input type="checkbox" name="diasLaborales" th:value="${dia}" th:id="${'dia_' + dia}" class="day-checkbox"
                                   th:checked="${empleado != null and empleado.getDiasLaborales().contains(dia)} or ${empleado == null and (dia != 'SABADO' and dia != 'DOMINGO')}" />
                            <label th:for="${'dia_' + dia}" class="day-label" th:text="${#strings.capitalize(#strings.toLowerCase(dia))}"></label>
                        </th:block>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Hora Inicio Turno</label>
                        <input type="time" class="form-control" name="horaInicioTrabajo" 
                               th:value="${empleado != null ? empleado.getHoraInicioTrabajo() : '08:00'}" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Hora Fin Turno</label>
                        <input type="time" class="form-control" name="horaFinTrabajo" 
                               th:value="${empleado != null ? empleado.getHoraFinTrabajo() : '17:00'}" required />
                    </div>
                </div>

                <div class="section-title">
                    <i class="bi bi-airplane text-primary"></i>
                    Vacaciones y Días Libres
                </div>

                <div class="mb-4">
                    <label class="form-label">Fechas Especiales / Días Libres (Separados por coma)</label>
                    <input type="text" class="form-control" name="vacacionesStr" 
                           th:value="${empleado != null ? #strings.listJoin(empleado.getDiasLibresVacaciones(), ', ') : ''}"
                           placeholder="Ej: 2026-07-20, 2026-12-25" />
                    <small class="form-text text-muted">Ingresa las fechas en formato AAAA-MM-DD separadas por coma.</small>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a th:href="@{/clinica/personal}" class="btn-cancel">
                        Cancelar
                    </a>
                    <button type="submit" class="btn-submit">
                        Guardar Colaborador
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
