<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Horario | ClínicaApp</title>
    <link th:replace="~{fragments/header :: favIcon}">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;
            --dark: #0f172a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.1);
            --shadow-xl: 0 16px 40px rgba(15, 23, 42, 0.12);
            --shadow-primary: 0 8px 24px rgba(79, 70, 229, 0.18);
            --shadow-warning: 0 8px 24px rgba(245, 158, 11, 0.18);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--gray-50);
            min-height: 100vh;
            color: var(--gray-700);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: linear-gradient(135deg, var(--gray-900) 0%, #1e1b4b 100%) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.15);
        }

        .navbar .container {
            padding-top: 0.875rem;
            padding-bottom: 0.875rem;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.02em;
            text-decoration: none;
        }

        .navbar-brand i {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.3rem;
        }

        .btn-back {
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            border-radius: 10px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
            transform: translateY(-1px);
        }

        /* ===== MAIN CARD ===== */
        .main-card {
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--gray-200);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            animation: slideUp 0.5s ease forwards;
            opacity: 0;
            animation-delay: 0.1s;
        }

        /* Card Header */
        .card-header-custom {
            padding: 1.5rem 1.75rem;
            border-bottom: 1px solid var(--gray-100);
            background: linear-gradient(135deg, #fafafa, #f8f9fa);
        }

        .card-header-custom h5 {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--gray-800);
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .card-header-custom h5 i {
            background: linear-gradient(135deg, var(--warning), #fbbf24);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        .card-body-custom {
            padding: 1.75rem;
        }

        /* ===== FORM ELEMENTS ===== */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label-custom {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-label-custom i {
            color: var(--warning);
            font-size: 0.875rem;
        }

        /* Time Input */
        .time-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gray-800);
            text-align: center;
            background: var(--gray-50);
            transition: var(--transition);
            cursor: pointer;
            outline: none;
        }

        .time-input:hover {
            border-color: var(--warning);
            background: white;
        }

        .time-input:focus {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
            background: white;
        }

        /* Select */
        .select-custom {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            color: var(--gray-800);
            background: var(--gray-50);
            transition: var(--transition);
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 14px;
            padding-right: 2.5rem;
        }

        .select-custom:hover {
            border-color: var(--warning);
            background-color: white;
        }

        .select-custom:focus {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.12);
            background-color: white;
        }

        /* ===== INFO ALERT ===== */
        .info-alert {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            background: linear-gradient(135deg, #ecfdf5, #d1fae5);
            border: 1.5px solid rgba(16, 185, 129, 0.15);
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
        }

        .info-alert i {
            color: var(--success);
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .info-alert span {
            font-weight: 600;
            font-size: 0.85rem;
            color: #065f46;
            line-height: 1.5;
        }

        .info-alert strong {
            color: var(--success);
            font-weight: 800;
        }

        /* ===== SAVE BUTTON ===== */
        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--warning), #fbbf24);
            color: #78350f;
            border: none;
            border-radius: var(--radius-lg);
            padding: 1rem;
            font-weight: 800;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: var(--shadow-warning);
            cursor: pointer;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(245, 158, 11, 0.3);
        }

        .btn-save i {
            font-size: 1.1rem;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 575.98px) {
            .card-body-custom {
                padding: 1.25rem;
            }

            .time-input {
                font-size: 1rem;
                padding: 0.75rem;
            }

            .select-custom {
                font-size: 0.9rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand">
                <i class="bi bi-clock-history"></i>
                Jornada Laboral
            </span>
            <a th:href="@{/clinica/dashboard}" class="btn-back">
                <i class="bi bi-arrow-left"></i>
                <span class="d-none d-sm-inline">Volver</span>
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- Main Card -->
                <div class="main-card">
                    <!-- Header -->
                    <div class="card-header-custom">
                        <h5>
                            <i class="bi bi-calendar-week"></i>
                            Definir Disponibilidad de Agenda
                        </h5>
                    </div>

                    <!-- Body -->
                    <div class="card-body-custom">
                        <form th:action="@{/clinica/horario/guardar}" method="post">

                            <!-- Hora Apertura -->
                            <div class="form-group">
                                <label class="form-label-custom">
                                    <i class="bi bi-sunrise"></i>
                                    Hora de Apertura
                                </label>
                                <input type="time" name="horaApertura" th:value="${clinica.horaApertura}"
                                    class="time-input" required>
                            </div>

                            <!-- Hora Cierre -->
                            <div class="form-group">
                                <label class="form-label-custom">
                                    <i class="bi bi-sunset"></i>
                                    Hora de Cierre
                                </label>
                                <input type="time" name="horaCierre" th:value="${clinica.horaCierre}" class="time-input"
                                    required>
                            </div>

                            <!-- Duración Turno -->
                            <div class="form-group">
                                <label class="form-label-custom">
                                    <i class="bi bi-hourglass-split"></i>
                                    Duración por Cita
                                </label>
                                <select name="duracionTurnoMinutos" class="select-custom">
                                    <option value="15" th:selected="${clinica.duracionTurnoMinutos == 15}">15 minutos
                                    </option>
                                    <option value="30" th:selected="${clinica.duracionTurnoMinutos == 30}">30 minutos
                                    </option>
                                    <option value="45" th:selected="${clinica.duracionTurnoMinutos == 45}">45 minutos
                                    </option>
                                    <option value="60" th:selected="${clinica.duracionTurnoMinutos == 60}">1 hora
                                    </option>
                                </select>
                            </div>

                            <!-- Info Alert -->
                            <div class="info-alert">
                                <i class="bi bi-info-circle-fill"></i>
                                <span>
                                    Los clientes verán turnos disponibles cada
                                    <strong th:text="${clinica.duracionTurnoMinutos}">30</strong>
                                    minutos dentro del horario definido.
                                </span>
                            </div>

                            <!-- Save Button -->
                            <button type="submit" class="btn-save">
                                <i class="bi bi-check2-circle"></i>
                                Guardar Disponibilidad
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
