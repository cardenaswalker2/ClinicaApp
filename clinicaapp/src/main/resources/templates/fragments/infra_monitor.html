    <div th:fragment="infra-monitor">
        <!-- Marcador de Seguridad -->
        <div sec:authorize="hasRole('ADMIN')" id="hex-admin-marker" style="display:none;"></div>

        <style>
            .maint-bar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 45px;
                background: linear-gradient(90deg, #ef4444, #b91c1c);
                color: white;
                z-index: 20000;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-weight: 800;
                font-size: 0.95rem;
                letter-spacing: 0.5px;
            }
            .broadcast-banner {
                position: fixed;
                top: 60px;
                left: 50%;
                transform: translateX(-50%);
                background: linear-gradient(135deg, #06b6d4, #0891b2);
                color: white;
                padding: 10px 30px;
                border-radius: 100px;
                font-size: 0.9rem;
                font-weight: 700;
                z-index: 15000;
                box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
                display: flex;
                align-items: center;
                gap: 12px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                animation: hexSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            @keyframes hexSlideDown {
                from { transform: translate(-50%, -100px); opacity: 0; }
                to { transform: translate(-50%, 0); opacity: 1; }
            }
            body.hex-maint-active {
                margin-top: 45px !important;
            }
            .maint-timer-box {
                background: rgba(0,0,0,0.4);
                padding: 4px 12px;
                border-radius: 8px;
                margin-left: 15px;
                font-family: 'Fira Code', monospace;
                font-size: 1.2rem;
                border: 1px solid rgba(255,255,255,0.2);
            }
        </style>

        <script th:inline="javascript">
            /*<![CDATA[*/
            (function() {
                console.log("HEX CORE: Iniciando monitor de infraestructura...");
                
                const isAdmin = document.getElementById('hex-admin-marker') !== null;
                console.log("HEX CORE: Rol detectado -> " + (isAdmin ? "ADMIN (Inmune)" : "USUARIO (Restringido)"));
                
                let maintenanceActive = false;
                let timerInterval = null;

                async function updateSystemStatus() {
                    try {
                        const response = await fetch('/api/system/status');
                        const data = await response.json();
                        console.log("HEX CORE: Sincronización ->", data);

                        // 1. Mensajes Globales
                        if(data.broadcastActivo && data.mensajeGlobal && data.mensajeGlobal.trim() !== "") {
                            renderBroadcast(data.mensajeGlobal, data.broadcastColor);
                        } else {
                            removeBroadcast();
                        }

                        // 2. Protocolo de Mantenimiento
                        if(data.modoMantenimiento) {
                            if(!maintenanceActive) {
                                activateMaintenance(data.minutosParaCierre, data.mantenimientoDesde, isAdmin);
                            }
                        } else if(maintenanceActive) {
                            deactivateMaintenance();
                        }
                    } catch (e) {
                        console.error("HEX CORE ERROR: Fallo en sincronización", e);
                    }
                }

                function renderBroadcast(msg, color) {
                    let banner = document.getElementById('hex-broadcast');
                    if(!banner) {
                        banner = document.createElement('div');
                        banner.id = 'hex-broadcast';
                        banner.className = 'broadcast-banner';
                        document.body.appendChild(banner);
                    }
                    
                    // Ajuste dinámico de color
                    const colors = {
                        info: 'linear-gradient(135deg, #06b6d4, #0891b2)',
                        warning: 'linear-gradient(135deg, #f59e0b, #d97706)',
                        danger: 'linear-gradient(135deg, #ef4444, #dc2626)'
                    };
                    
                    banner.style.background = colors[color] || colors.info;
                    banner.innerHTML = `<i class="bi bi-broadcast"></i> ${msg}`;
                    banner.style.display = 'flex';
                }

                function removeBroadcast() {
                    const banner = document.getElementById('hex-broadcast');
                    if(banner) banner.remove();
                }

                function activateMaintenance(mins, startTS, isUserAdmin) {
                    console.log("HEX CORE: ACTIVANDO PROTOCOLO DE VISUALIZACIÓN (Admin: " + isUserAdmin + ")");
                    maintenanceActive = true;
                    document.body.classList.add('hex-maint-active');
                    
                    let bar = document.getElementById('hex-maint-bar');
                    if(!bar) {
                        bar = document.createElement('div');
                        bar.id = 'hex-maint-bar';
                        bar.className = 'maint-bar';
                        if(isUserAdmin) {
                            // Estilo informativo para Admin
                            bar.style.background = 'linear-gradient(90deg, #6366f1, #4338ca)';
                            bar.innerHTML = `
                                <i class="bi bi-shield-check me-2"></i>
                                MANTENIMIENTO ACTIVO (MODO ADMIN - INMUNE) - CIERRE EN:
                                <span id="hex-maint-timer" class="maint-timer-box">00:00</span>
                            `;
                        } else {
                            // Estilo de alerta para Usuario
                            bar.innerHTML = `
                                <i class="bi bi-shield-fill-exclamation me-2"></i>
                                MANTENIMIENTO DE INFRAESTRUCTURA - CIERRE EN:
                                <span id="hex-maint-timer" class="maint-timer-box">00:00</span>
                            `;
                        }
                        document.body.appendChild(bar);
                    }

                    const timerEl = document.getElementById('hex-maint-timer');
                    
                    function runTimer() {
                        const now = new Date();
                        const start = new Date(startTS || now);
                        const end = new Date(start.getTime() + (mins * 60 * 1000));
                        let diff = Math.floor((end - now) / 1000);

                        if(diff <= 0) {
                            clearInterval(timerInterval);
                            timerEl.innerText = "00:00";
                            setTimeout(() => {
                                if(!isUserAdmin) window.location.href = "/logout?maintenance";
                                else console.log("HEX CORE: Tiempo agotado - Inmunidad Admin activa.");
                            }, 1000);
                        } else {
                            const m = Math.floor(diff / 60);
                            const s = diff % 60;
                            timerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        }
                    }

                    if(timerInterval) clearInterval(timerInterval);
                    runTimer();
                    timerInterval = setInterval(runTimer, 1000);
                }

                function deactivateMaintenance() {
                    console.log("HEX CORE: DESACTIVANDO PROTOCOLO - SISTEMA RESTAURADO");
                    maintenanceActive = false;
                    document.body.classList.remove('hex-maint-active');
                    const bar = document.getElementById('hex-maint-bar');
                    if(bar) bar.remove();
                    if(timerInterval) clearInterval(timerInterval);
                    window.location.reload();
                }

                setInterval(updateSystemStatus, 5000);
                setTimeout(updateSystemStatus, 1000);
                console.log("HEX CORE: Monitor inicializado correctamente.");

                // ==============================================================
                // MÓDULO DE TELEMETRÍA Y SUPERVISIÓN ACTIVA EN TIEMPO REAL
                // ==============================================================
                (function initTelemetryAndMessages() {
                    const currentPath = window.location.pathname;
                    let seccionNombre = "Inicio";

                    if (currentPath.includes("/citas")) seccionNombre = "Citas";
                    else if (currentPath.includes("/mascotas")) seccionNombre = "Mascotas";
                    else if (currentPath.includes("/historial")) seccionNombre = "Historial Médico";
                    else if (currentPath.includes("/perfil")) seccionNombre = "Perfil";
                    else if (currentPath.includes("/pagos") || currentPath.includes("/checkout")) seccionNombre = "Pagos";
                    else if (currentPath.includes("/recordatorios")) seccionNombre = "Recordatorios";
                    else if (currentPath.includes("/comunidad")) seccionNombre = "Comunidad Adopciones";
                    else if (currentPath.includes("/dashboard")) seccionNombre = "Dashboard";
                    else if (currentPath.includes("/clinicas") || currentPath.includes("/buscar-clinicas")) seccionNombre = "Búsqueda de Clínicas";
                    else if (currentPath.includes("/admin/supervision")) seccionNombre = "Supervisión de Usuarios";
                    else if (currentPath.includes("/admin")) seccionNombre = "Panel Administrativo";
                    else if (currentPath.includes("/recepcion")) seccionNombre = "Recepción";
                    else if (currentPath.includes("/veterinario")) seccionNombre = "Atención Veterinaria";

                    // 1. Emitir evento de entrada a sección
                    function reportEvent(tipoEvento, accion) {
                        try {
                            fetch('/api/supervision/telemetria/heartbeat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    seccion: seccionNombre,
                                    url: currentPath,
                                    tipoEvento: tipoEvento,
                                    accion: accion,
                                    metadata: document.title
                                })
                            }).catch(() => {});
                        } catch (e) {}
                    }

                    // Reportar entrada a la página actual
                    reportEvent('ENTRADA_SECCION', 'Entró a ' + seccionNombre);

                    // 2. Pulso Heartbeat cada 15 segundos para presencia en vivo
                    setInterval(function() {
                        try {
                            fetch('/api/supervision/telemetria/heartbeat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    seccion: seccionNombre,
                                    url: currentPath
                                })
                            }).catch(() => {});
                        } catch (e) {}
                    }, 15000);

                    // 3. Capturar clics en enlaces o botones interactivos clave
                    document.addEventListener('click', function(e) {
                        const target = e.target.closest('a, button');
                        if (target) {
                            const txt = (target.innerText || target.getAttribute('title') || target.getAttribute('aria-label') || '').trim();
                            if (txt && txt.length < 50 && !txt.includes('Salir') && !txt.includes('Logout')) {
                                reportEvent('ACCION', 'Interactuó con: ' + txt + ' en ' + seccionNombre);
                            }
                        }
                    }, { passive: true });

                    // 4. Verificación de Mensajes Directos del Super Admin para el usuario
                    let lastKnownMsgId = null;
                    async function checkDirectAdminMessages() {
                        try {
                            const res = await fetch('/api/supervision/mis-mensajes', { cache: 'no-store' });
                            if (res.status === 200) {
                                const data = await res.json();
                                if (data.mensajes && data.mensajes.length > 0) {
                                    // Buscar el mensaje no leído más reciente
                                    const unread = data.mensajes.find(m => !m.leido);
                                    if (unread && unread.id !== lastKnownMsgId) {
                                        lastKnownMsgId = unread.id;
                                        showAdminDirectModal(unread);
                                    }
                                }
                            }
                        } catch (err) {}
                    }

                    function showAdminDirectModal(msg) {
                        let existing = document.getElementById('admin-direct-modal');
                        if (existing) existing.remove();

                        const modalHtml = document.createElement('div');
                        modalHtml.id = 'admin-direct-modal';
                        modalHtml.style.position = 'fixed';
                        modalHtml.style.top = '24px';
                        modalHtml.style.right = '24px';
                        modalHtml.style.zIndex = '999999';
                        modalHtml.style.maxWidth = '440px';
                        modalHtml.style.width = 'calc(100% - 48px)';
                        modalHtml.style.background = 'rgba(15, 23, 42, 0.98)';
                        modalHtml.style.backdropFilter = 'blur(25px)';
                        modalHtml.style.border = '1.5px solid #00d4ff';
                        modalHtml.style.borderRadius = '20px';
                        modalHtml.style.padding = '22px';
                        modalHtml.style.color = '#ffffff';
                        modalHtml.style.boxShadow = '0 25px 60px rgba(0,0,0,0.8), 0 0 35px rgba(0, 212, 255, 0.35)';
                        modalHtml.style.fontFamily = "'Space Grotesk', -apple-system, sans-serif";
                        modalHtml.style.animation = 'hexSlideDown 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards';

                        modalHtml.innerHTML = `
                            <div style="display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px;">
                                <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #00d4ff, #6366f1); display: flex; align-items: center; justify-content: center; font-size: 1.35rem; color: #fff; flex-shrink: 0; box-shadow: 0 0 15px rgba(0,212,255,0.4);">
                                    <i class="bi bi-shield-lock-fill"></i>
                                </div>
                                <div style="flex-grow: 1;">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: #38bdf8; font-weight: 800;">Comunicado de la Administración</span>
                                        <button id="close-admin-msg-btn" style="background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 0 4px;">&times;</button>
                                    </div>
                                    <h6 style="margin: 4px 0 0; font-size: 15px; font-weight: 700; color: #ffffff;">${msg.asunto || 'Notificación Oficial'}</h6>
                                </div>
                            </div>
                            <div style="background: rgba(255, 255, 255, 0.04); padding: 15px 18px; border-radius: 14px; font-size: 14px; color: #f1f5f9; line-height: 1.6; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.08);">
                                ${msg.contenido}
                            </div>
                            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                                <button id="ack-admin-msg-btn" style="background: linear-gradient(135deg, #00d4ff, #6366f1); color: white; border: none; padding: 9px 20px; border-radius: 100px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,212,255,0.3);">
                                    Entendido / Marcar Leído
                                </button>
                            </div>
                        `;

                        document.body.appendChild(modalHtml);

                        document.getElementById('close-admin-msg-btn').onclick = function() {
                            modalHtml.remove();
                        };

                        document.getElementById('ack-admin-msg-btn').onclick = function() {
                            fetch('/api/supervision/mis-mensajes/' + msg.id + '/leer', { method: 'POST' });
                            modalHtml.remove();
                        };
                    }

                    // Chequear mensajes cada 5 segundos
                    setInterval(checkDirectAdminMessages, 5000);
                    setTimeout(checkDirectAdminMessages, 1500);
                })();
            })();
            /*]]>*/
        </script>
    </div>
