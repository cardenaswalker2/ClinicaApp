    <div th:fragment="infra-monitor">
        <!-- Marcador de Seguridad -->
        <div sec:authorize="hasRole('ADMIN')" id="hex-admin-marker" style="display:none;"></div>

        <!-- BANNER PERMANENTE: SESIÓN DE SOPORTE ADMINISTRATIVO (DELEGADA) -->
        <div th:if="${sesionSoporteDelegada != null}" id="support-delegated-banner" style="position: fixed; top: 0; left: 0; width: 100%; height: 42px; background: linear-gradient(90deg, #4f46e5, #0284c7); color: #ffffff; z-index: 999998; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700;">
            <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                <span style="background: rgba(255,255,255,0.2); padding: 3px 8px; border-radius: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">🛡️ SESIÓN DE SOPORTE ADMINISTRATIVO</span>
                <span>Asistiendo a: <strong th:text="${sesionSoporteDelegada.usuarioEmail}">usuario@clinicaapp.com</strong></span>
                <span class="d-none d-md-inline" style="opacity: 0.8;">| Super Admin: <span th:text="${sesionSoporteDelegada.adminEmail}">admin@clinicaapp.com</span></span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
                <span id="support-timer-display" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; background: rgba(0,0,0,0.25); padding: 2px 8px; border-radius: 6px;">15:00</span>
                <button onclick="exitSupportDelegatedSession()" style="background: #ffffff; color: #4f46e5; border: none; padding: 4px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 4px;">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Salir de Soporte
                </button>
            </div>
        </div>
        <script th:if="${sesionSoporteDelegada != null}" th:inline="javascript">
            /*<![CDATA[*/
            (function() {
                document.body.style.paddingTop = '42px';
                const finStr = /*[[${sesionSoporteDelegada.fechaFin}]]*/ null;
                const adminEmail = /*[[${sesionSoporteDelegada.adminEmail}]]*/ null;
                const userEmail = /*[[${sesionSoporteDelegada.usuarioEmail}]]*/ null;
                
                if (finStr) {
                    const target = new Date(finStr).getTime();
                    const timerEl = document.getElementById('support-timer-display');
                    const interval = setInterval(function() {
                        const now = new Date().getTime();
                        const diff = Math.floor((target - now) / 1000);
                        if (diff <= 0) {
                            clearInterval(interval);
                            alert("La sesión de soporte administrativo ha expirado (15 minutos alcanzados). Restaurando contexto...");
                            exitSupportDelegatedSession();
                        } else {
                            const m = Math.floor(diff / 60);
                            const s = diff % 60;
                            if (timerEl) timerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        }
                    }, 1000);
                }

                window.exitSupportDelegatedSession = async function() {
                    try {
                        await fetch('/api/supervision/usuario/' + encodeURIComponent(userEmail) + '/soporte/finalizar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ adminEmail: adminEmail })
                        });
                    } catch(e) {}
                    window.location.href = "/admin/supervision";
                };
            })();
            /*]]>*/
        </script>

        <style>
            .maint-bar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 45px;
                background: linear-gradient(90deg, #ef4444, #b91c1c);
                color: white;
                z-index: 20000;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-weight: 800;
                font-size: 0.95rem;
                letter-spacing: 0.5px;
            }
            .broadcast-banner {
                position: fixed;
                top: 60px;
                left: 50%;
                transform: translateX(-50%);
                background: linear-gradient(135deg, #06b6d4, #0891b2);
                color: white;
                padding: 10px 30px;
                border-radius: 100px;
                font-size: 0.9rem;
                font-weight: 700;
                z-index: 15000;
                box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
                display: flex;
                align-items: center;
                gap: 12px;
                border: 1px solid rgba(255, 255, 255, 0.2);
                animation: hexSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            @keyframes hexSlideDown {
                from { transform: translate(-50%, -100px); opacity: 0; }
                to { transform: translate(-50%, 0); opacity: 1; }
            }
            body.hex-maint-active {
                margin-top: 45px !important;
            }
            .maint-timer-box {
                background: rgba(0,0,0,0.4);
                padding: 4px 12px;
                border-radius: 8px;
                margin-left: 15px;
                font-family: 'Fira Code', monospace;
                font-size: 1.2rem;
                border: 1px solid rgba(255,255,255,0.2);
            }

            /* Responsive Toast Notification */
            #admin-notif-toast {
                position: fixed;
                top: 70px;
                right: 18px;
                z-index: 999999;
                max-width: 380px;
                width: calc(100% - 36px);
                background: #ffffff;
                border: 1px solid #cbd5e1;
                border-radius: 14px;
                padding: 12px 14px;
                box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15), 0 8px 10px -6px rgba(0,0,0,0.08);
                display: flex;
                align-items: center;
                gap: 12px;
                cursor: pointer;
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
                font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
                animation: toastSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }
            @keyframes toastSlideIn {
                from { transform: translateY(-20px); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
            @media (max-width: 768px) {
                #admin-notif-toast {
                    top: 65px !important;
                    right: 50% !important;
                    transform: translateX(50%) !important;
                    width: calc(100% - 24px) !important;
                    max-width: 420px !important;
                    animation: toastSlideInMobile 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
                }
                @keyframes toastSlideInMobile {
                    from { transform: translate(50%, -20px); opacity: 0; }
                    to { transform: translate(50%, 0); opacity: 1; }
                }
            }
        </style>

        <script th:inline="javascript">
            /*<![CDATA[*/
            (function() {
                console.log("HEX CORE: Iniciando monitor de infraestructura...");
                
                const isAdmin = document.getElementById('hex-admin-marker') !== null;
                console.log("HEX CORE: Rol detectado -> " + (isAdmin ? "ADMIN (Inmune)" : "USUARIO (Restringido)"));
                
                let maintenanceActive = false;
                let timerInterval = null;

                async function updateSystemStatus() {
                    try {
                        const response = await fetch('/api/system/status');
                        const data = await response.json();
                        console.log("HEX CORE: Sincronización ->", data);

                        // 1. Mensajes Globales
                        if(data.broadcastActivo && data.mensajeGlobal && data.mensajeGlobal.trim() !== "") {
                            renderBroadcast(data.mensajeGlobal, data.broadcastColor);
                        } else {
                            removeBroadcast();
                        }

                        // 2. Protocolo de Mantenimiento
                        if(data.modoMantenimiento) {
                            if(!maintenanceActive) {
                                activateMaintenance(data.minutosParaCierre, data.mantenimientoDesde, isAdmin);
                            }
                        } else if(maintenanceActive) {
                            deactivateMaintenance();
                        }
                    } catch (e) {
                        console.error("HEX CORE ERROR: Fallo en sincronización", e);
                    }
                }

                function renderBroadcast(msg, color) {
                    let banner = document.getElementById('hex-broadcast');
                    if(!banner) {
                        banner = document.createElement('div');
                        banner.id = 'hex-broadcast';
                        banner.className = 'broadcast-banner';
                        document.body.appendChild(banner);
                    }
                    
                    // Ajuste dinámico de color
                    const colors = {
                        info: 'linear-gradient(135deg, #06b6d4, #0891b2)',
                        warning: 'linear-gradient(135deg, #f59e0b, #d97706)',
                        danger: 'linear-gradient(135deg, #ef4444, #dc2626)'
                    };
                    
                    banner.style.background = colors[color] || colors.info;
                    banner.innerHTML = `<i class="bi bi-broadcast"></i> ${msg}`;
                    banner.style.display = 'flex';
                }

                function removeBroadcast() {
                    const banner = document.getElementById('hex-broadcast');
                    if(banner) banner.remove();
                }

                function activateMaintenance(mins, startTS, isUserAdmin) {
                    console.log("HEX CORE: ACTIVANDO PROTOCOLO DE VISUALIZACIÓN (Admin: " + isUserAdmin + ")");
                    maintenanceActive = true;
                    document.body.classList.add('hex-maint-active');
                    
                    let bar = document.getElementById('hex-maint-bar');
                    if(!bar) {
                        bar = document.createElement('div');
                        bar.id = 'hex-maint-bar';
                        bar.className = 'maint-bar';
                        if(isUserAdmin) {
                            // Estilo informativo para Admin
                            bar.style.background = 'linear-gradient(90deg, #6366f1, #4338ca)';
                            bar.innerHTML = `
                                <i class="bi bi-shield-check me-2"></i>
                                MANTENIMIENTO ACTIVO (MODO ADMIN - INMUNE) - CIERRE EN:
                                <span id="hex-maint-timer" class="maint-timer-box">00:00</span>
                            `;
                        } else {
                            // Estilo de alerta para Usuario
                            bar.innerHTML = `
                                <i class="bi bi-shield-fill-exclamation me-2"></i>
                                MANTENIMIENTO DE INFRAESTRUCTURA - CIERRE EN:
                                <span id="hex-maint-timer" class="maint-timer-box">00:00</span>
                            `;
                        }
                        document.body.appendChild(bar);
                    }

                    const timerEl = document.getElementById('hex-maint-timer');
                    
                    function runTimer() {
                        const now = new Date();
                        const start = new Date(startTS || now);
                        const end = new Date(start.getTime() + (mins * 60 * 1000));
                        let diff = Math.floor((end - now) / 1000);

                        if(diff <= 0) {
                            clearInterval(timerInterval);
                            timerEl.innerText = "00:00";
                            setTimeout(() => {
                                if(!isUserAdmin) window.location.href = "/logout?maintenance";
                                else console.log("HEX CORE: Tiempo agotado - Inmunidad Admin activa.");
                            }, 1000);
                        } else {
                            const m = Math.floor(diff / 60);
                            const s = diff % 60;
                            timerEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                        }
                    }

                    if(timerInterval) clearInterval(timerInterval);
                    runTimer();
                    timerInterval = setInterval(runTimer, 1000);
                }

                function deactivateMaintenance() {
                    console.log("HEX CORE: DESACTIVANDO PROTOCOLO - SISTEMA RESTAURADO");
                    maintenanceActive = false;
                    document.body.classList.remove('hex-maint-active');
                    const bar = document.getElementById('hex-maint-bar');
                    if(bar) bar.remove();
                    if(timerInterval) clearInterval(timerInterval);
                    window.location.reload();
                }

                setInterval(updateSystemStatus, 5000);
                setTimeout(updateSystemStatus, 1000);
                console.log("HEX CORE: Monitor inicializado correctamente.");

                // ==============================================================
                // MÓDULO DE TELEMETRÍA Y SUPERVISIÓN ACTIVA EN TIEMPO REAL
                // ==============================================================
                (function initTelemetryAndMessages() {
                    const currentPath = window.location.pathname;
                    let seccionNombre = "Inicio";

                    if (currentPath.includes("/citas")) seccionNombre = "Citas";
                    else if (currentPath.includes("/mascotas")) seccionNombre = "Mascotas";
                    else if (currentPath.includes("/historial")) seccionNombre = "Historial Médico";
                    else if (currentPath.includes("/perfil")) seccionNombre = "Perfil";
                    else if (currentPath.includes("/pagos") || currentPath.includes("/checkout")) seccionNombre = "Pagos";
                    else if (currentPath.includes("/recordatorios")) seccionNombre = "Recordatorios";
                    else if (currentPath.includes("/comunidad")) seccionNombre = "Comunidad Adopciones";
                    else if (currentPath.includes("/dashboard")) seccionNombre = "Dashboard";
                    else if (currentPath.includes("/clinicas") || currentPath.includes("/buscar-clinicas")) seccionNombre = "Búsqueda de Clínicas";
                    else if (currentPath.includes("/admin/supervision")) seccionNombre = "Supervisión de Usuarios";
                    else if (currentPath.includes("/admin")) seccionNombre = "Panel Administrativo";
                    else if (currentPath.includes("/recepcion")) seccionNombre = "Recepción";
                    else if (currentPath.includes("/veterinario")) seccionNombre = "Atención Veterinaria";

                    // 1. Emitir evento de entrada a sección
                    function reportEvent(tipoEvento, accion) {
                        try {
                            fetch('/api/supervision/telemetria/heartbeat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    seccion: seccionNombre,
                                    url: currentPath,
                                    tipoEvento: tipoEvento,
                                    accion: accion,
                                    metadata: document.title
                                })
                            }).catch(() => {});
                        } catch (e) {}
                    }

                    // Reportar entrada a la página actual
                    reportEvent('ENTRADA_SECCION', 'Entró a ' + seccionNombre);

                    // 2. Pulso Heartbeat cada 15 segundos para presencia en vivo
                    setInterval(function() {
                        try {
                            fetch('/api/supervision/telemetria/heartbeat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    seccion: seccionNombre,
                                    url: currentPath
                                })
                            }).catch(() => {});
                        } catch (e) {}
                    }, 15000);

                    // 3. Capturar clics en enlaces o botones interactivos clave
                    document.addEventListener('click', function(e) {
                        const target = e.target.closest('a, button');
                        if (target) {
                            const txt = (target.innerText || target.getAttribute('title') || target.getAttribute('aria-label') || '').trim();
                            if (txt && txt.length < 50 && !txt.includes('Salir') && !txt.includes('Logout')) {
                                reportEvent('ACCION', 'Interactuó con: ' + txt + ' en ' + seccionNombre);
                            }
                        }
                    }, { passive: true });

                    // 4. Verificación de Mensajes Directos del Super Admin para el usuario
                    let lastShownMsgId = null;
                    let activeToast = null;
                    let activeModal = null;
                    let dismissedMsgIds = new Set();

                    async function checkDirectAdminMessages() {
                        try {
                            const res = await fetch('/api/supervision/mis-mensajes', { cache: 'no-store' });
                            if (res.status === 200) {
                                const data = await res.json();
                                if (data.mensajes && data.mensajes.length > 0) {
                                    // Filtrar mensajes no leídos que vengan del SUPER_ADMIN y que no hayan sido descartados en esta sesión
                                    const unreadList = data.mensajes.filter(m => !m.leido && m.origen === 'SUPER_ADMIN' && !dismissedMsgIds.has(m.id));
                                    if (unreadList.length > 0) {
                                        const latest = unreadList[0];
                                        if (latest.id !== lastShownMsgId && !activeToast && !activeModal) {
                                            lastShownMsgId = latest.id;
                                            showAdminNotificationToast(latest, unreadList.length);
                                        }
                                    } else {
                                        if (activeToast) {
                                            activeToast.remove();
                                            activeToast = null;
                                        }
                                    }
                                }
                            }
                        } catch (err) {}
                    }

                    // Notificación Toast No-Intrusiva (Flotante arriba a la derecha / centro en móvil)
                    function showAdminNotificationToast(msg, count) {
                        if (activeToast) activeToast.remove();

                        const toast = document.createElement('div');
                        toast.id = 'admin-notif-toast';

                        const remitente = msg.remitenteNombre || 'Super Administrador';
                        const asunto = msg.asunto || 'Mensaje de la Administración';

                        toast.innerHTML = `
                            <div style="width: 38px; height: 38px; border-radius: 10px; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>
                            <div style="flex-grow: 1; min-width: 0;">
                                <div style="display: flex; align-items: center; justify-content: space-between;">
                                    <span style="font-size: 11px; font-weight: 800; color: #0284c7; text-transform: uppercase; letter-spacing: 0.5px;">Mensaje de Administración</span>
                                    <button id="dismiss-toast-btn" style="background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1;">&times;</button>
                                </div>
                                <div style="font-size: 13.5px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;">${asunto}</div>
                                <div style="font-size: 12px; color: #64748b;">Toca aquí para leer y responder</div>
                            </div>
                        `;

                        document.body.appendChild(toast);
                        activeToast = toast;

                        // Al hacer clic en el toast se abre el diálogo de lectura/respuesta
                        toast.onclick = function(e) {
                            if (e.target.id === 'dismiss-toast-btn') return;
                            toast.remove();
                            activeToast = null;
                            showAdminDirectModal(msg);
                        };

                        // Botón de cerrar el toast sin leer
                        const dismissBtn = toast.querySelector('#dismiss-toast-btn');
                        if (dismissBtn) {
                            dismissBtn.onclick = function(e) {
                                e.stopPropagation();
                                dismissedMsgIds.add(msg.id);
                                toast.style.opacity = '0';
                                toast.style.transform = 'translateY(-10px)';
                                setTimeout(() => {
                                    toast.remove();
                                    activeToast = null;
                                }, 300);
                            };
                        }
                    }

                    function showAdminDirectModal(msg) {
                        if (activeModal) activeModal.remove();

                        const modalHtml = document.createElement('div');
                        modalHtml.id = 'admin-direct-modal';
                        modalHtml.style.position = 'fixed';
                        modalHtml.style.top = '0';
                        modalHtml.style.left = '0';
                        modalHtml.style.width = '100vw';
                        modalHtml.style.height = '100vh';
                        modalHtml.style.background = 'rgba(15, 23, 42, 0.4)';
                        modalHtml.style.backdropFilter = 'blur(4px)';
                        modalHtml.style.zIndex = '999999';
                        modalHtml.style.display = 'flex';
                        modalHtml.style.alignItems = 'center';
                        modalHtml.style.justifyContent = 'center';
                        modalHtml.style.padding = '16px';
                        modalHtml.style.boxSizing = 'border-box';
                        modalHtml.style.fontFamily = "'Plus Jakarta Sans', system-ui, -apple-system, sans-serif";

                        const remitente = msg.remitenteNombre || 'Super Administrador';
                        const asunto = msg.asunto || 'Mensaje Oficial';

                        modalHtml.innerHTML = `
                            <div style="background: #ffffff; border-radius: 18px; max-width: 480px; width: 100%; padding: 22px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 1px solid #cbd5e1; box-sizing: border-box; animation: hexSlideDown 0.3s ease;">
                                <div style="display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px;">
                                    <div style="width: 42px; height: 42px; border-radius: 12px; background: #e0f2fe; border: 1px solid #bae6fd; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: #0284c7; flex-shrink: 0;">
                                        <i class="fa-solid fa-shield-halved"></i>
                                    </div>
                                    <div style="flex-grow: 1; min-width: 0;">
                                        <div style="display: flex; justify-content: space-between; align-items: center;">
                                            <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #0284c7; font-weight: 800;">Comunicado Oficial de Administración</span>
                                            <button id="close-admin-modal-btn" style="background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; padding: 0 4px; line-height: 1;">&times;</button>
                                        </div>
                                        <h6 style="margin: 2px 0 0; font-size: 15px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${asunto}</h6>
                                    </div>
                                </div>
                                <div style="background: #f8fafc; padding: 14px 16px; border-radius: 12px; font-size: 13.5px; color: #334155; line-height: 1.6; margin-bottom: 14px; border: 1px solid #e2e8f0; word-break: break-word; max-height: 200px; overflow-y: auto;">
                                    ${msg.contenido}
                                </div>
                                
                                <!-- Caja de Respuesta Bidireccional Directa -->
                                <div style="margin-bottom: 14px;">
                                    <textarea id="reply-admin-input" placeholder="Escribe tu respuesta al Administrador aquí..." style="width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-family: inherit; resize: none; height: 68px; outline: none; box-sizing: border-box;"></textarea>
                                </div>

                                <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                                    <button id="ack-admin-msg-btn" style="background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 600; cursor: pointer;">
                                        Marcar como leído
                                    </button>
                                    <button id="send-admin-reply-btn" style="background: #0284c7; color: white; border: none; padding: 8px 20px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer;">
                                        <i class="fa-solid fa-paper-plane" style="margin-right: 5px;"></i> Responder
                                    </button>
                                </div>
                            </div>
                        `;

                        document.body.appendChild(modalHtml);
                        activeModal = modalHtml;

                        document.getElementById('close-admin-modal-btn').onclick = function() {
                            dismissedMsgIds.add(msg.id);
                            modalHtml.remove();
                            activeModal = null;
                        };

                        document.getElementById('ack-admin-msg-btn').onclick = function() {
                            fetch('/api/supervision/mis-mensajes/' + msg.id + '/leer', { method: 'POST' });
                            dismissedMsgIds.add(msg.id);
                            modalHtml.remove();
                            activeModal = null;
                        };

                        document.getElementById('send-admin-reply-btn').onclick = async function() {
                            const input = document.getElementById('reply-admin-input');
                            const val = input.value.trim();
                            if (!val) {
                                input.focus();
                                return;
                            }
                            const btn = this;
                            btn.disabled = true;
                            btn.innerText = "Enviando...";

                            // Marcar el mensaje actual del admin como leído de inmediato
                            fetch('/api/supervision/mis-mensajes/' + msg.id + '/leer', { method: 'POST' });
                            dismissedMsgIds.add(msg.id);

                            try {
                                const resp = await fetch('/api/supervision/mis-mensajes/responder', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ contenido: val })
                                });
                                if (resp.ok) {
                                    modalHtml.querySelector('div > div').innerHTML = `
                                        <div style="text-align: center; padding: 25px 15px; color: #16a34a; font-weight: 700; font-size: 15px;">
                                            <i class="fa-solid fa-circle-check" style="font-size: 32px; margin-bottom: 12px; display: block;"></i>
                                            ¡Respuesta enviada exitosamente al Super Administrador!
                                        </div>
                                    `;
                                    setTimeout(() => {
                                        modalHtml.remove();
                                        activeModal = null;
                                    }, 1500);
                                } else {
                                    alert("Error al enviar la respuesta.");
                                    btn.disabled = false;
                                    btn.innerText = "Responder";
                                }
                            } catch(e) {
                                alert("Error de conexión al responder.");
                                btn.disabled = false;
                                btn.innerText = "Responder";
                            }
                        };
                    }

                    // Chequear mensajes cada 6 segundos
                    setInterval(checkDirectAdminMessages, 6000);
                    setTimeout(checkDirectAdminMessages, 1500);
                })();
            })();
            /*]]>*/
        </script>
