<div th:fragment="mic-button">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --nova-primary: #6366f1;
            --nova-secondary: #a855f7;
            --nova-accent: #22d3ee;
            --nova-dark: #0f172a;
            --nova-glass: rgba(15, 23, 42, 0.8); /* Fondo más oscuro por defecto para resaltar Aurora */
            --nova-glass-border: rgba(255, 255, 255, 0.15);
            --nova-text-nova: #f8fafc;
            --nova-bg-nova: rgba(255, 255, 255, 0.1);
            --nova-font: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="light"] {
            --nova-glass: rgba(255, 255, 255, 0.9); /* Más opaco para mejor contraste */
            --nova-glass-border: rgba(99, 102, 241, 0.3);
            --nova-text-nova: #1e293b; 
            --nova-text-muted: #64748b; /* Gris más oscuro para modo día */
            --nova-bg-nova: rgba(255, 255, 255, 0.8);
            --nova-chip-text: #4f46e5;
            --nova-chip-bg: rgba(99, 102, 241, 0.1);
            --nova-close-filter: none;
            --nova-aurora-opacity: 0.15;
        }

        [data-theme="dark"] {
            --nova-text-muted: rgba(255, 255, 255, 0.5);
            --nova-chip-text: #c7d2fe;
            --nova-chip-bg: rgba(99, 102, 241, 0.15);
            --nova-close-filter: invert(1) grayscale(100%) brightness(200%);
            --nova-aurora-opacity: 0.4;
        }

        /* Ventana Principal del Bot */
        .nova-window {
            position: fixed;
            bottom: 110px;
            right: 30px;
            width: 400px;
            height: 650px;
            background: var(--nova-glass);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-radius: 35px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px var(--nova-glass-border);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 10000;
            font-family: var(--nova-font);
            animation: novaEnter 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid var(--nova-glass-border);
        }

        @keyframes novaEnter {
            from { opacity: 0; transform: translateY(40px) scale(0.95); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* Aurora Blobs Background */
        .nova-window::before, .nova-window::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: var(--nova-aurora-opacity);
            animation: auroraFloat 15s infinite alternate;
        }

        .nova-window::before {
            background: radial-gradient(circle, var(--nova-primary), transparent);
            top: -50px;
            left: -50px;
        }

        .nova-window::after {
            background: radial-gradient(circle, var(--nova-secondary), transparent);
            bottom: -50px;
            right: -50px;
            animation-delay: -7s;
        }

        @keyframes auroraFloat {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(180deg); }
        }

        /* RESPONSIVIDAD NOVA MÓVIL */
        @media (max-width: 500px) {
            .nova-window {
                width: calc(100% - 40px);
                height: 85vh;
                right: 20px;
                bottom: 100px;
                border-radius: 30px;
            }
        }

        .nova-header {
            background: rgba(15, 23, 42, 0.1);
            color: var(--nova-text-nova);
            padding: 24px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--nova-glass-border);
        }

        .nova-header .btn-link:hover {
            transform: scale(1.1);
            color: #ef4444 !important;
            filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.5));
        }

        .nova-avatar-box {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--nova-primary), var(--nova-secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        .nova-avatar-box::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .nova-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: rgba(15, 23, 42, 0.1);
            scroll-behavior: smooth;
            transition: opacity 0.3s ease;
        }

        /* Custom Scrollbar */
        .nova-body::-webkit-scrollbar { width: 5px; }
        .nova-body::-webkit-scrollbar-track { background: transparent; }
        .nova-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Burbujas de Chat */
        .bubble {
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 14.5px;
            line-height: 1.6;
            max-width: 85%;
            position: relative;
            animation: bubblePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bubblePop {
            from { opacity: 0; transform: scale(0.8) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .bubble-nova {
            background: var(--nova-bg-nova);
            color: var(--nova-text-nova);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--nova-glass-border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .bubble-user {
            background: linear-gradient(135deg, var(--nova-primary), #4f46e5);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .timestamp {
            font-size: 10px;
            color: var(--nova-text-muted);
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .bubble-user .timestamp { color: rgba(255,255,255,0.7); }

        /* Chips / Quick Actions */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
            animation: fadeInUp 0.5s ease;
        }

        .nav-chip {
            background: var(--nova-chip-bg);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: var(--nova-chip-text);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(5px);
        }

        .nav-chip:hover {
            background: var(--nova-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        /* Typing Indicator */
        .typing-container {
            display: none;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
            border-radius: 22px;
            border-bottom-left-radius: 6px;
            width: max-content;
            margin-bottom: 10px;
            border: 1px solid var(--nova-glass-border);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--nova-accent);
            border-radius: 50%;
            margin: 0 2px;
            display: inline-block;
            animation: typingBounce 1s infinite ease-in-out;
            box-shadow: 0 0 10px var(--nova-accent);
        }

        @keyframes typingBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Siri Wave (Listening) */
        .sound-wave {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 30px;
            margin-bottom: 15px;
        }

        .sound-wave span {
            width: 4px;
            background: var(--nova-accent);
            border-radius: 10px;
            animation: waveHeight 1.2s infinite ease-in-out;
            box-shadow: 0 0 15px var(--nova-accent);
        }

        .sound-wave span:nth-child(2) { animation-delay: 0.1s; }
        .sound-wave span:nth-child(3) { animation-delay: 0.2s; }
        .sound-wave span:nth-child(4) { animation-delay: 0.3s; }
        .sound-wave span:nth-child(5) { animation-delay: 0.4s; }
        .sound-wave span:nth-child(6) { animation-delay: 0.5s; }
        .sound-wave span:nth-child(7) { animation-delay: 0.6s; }

        @keyframes waveHeight {
            0%, 100% { height: 8px; opacity: 0.5; }
            50% { height: 28px; opacity: 1; }
        }

        .nova-footer {
            padding: 24px 20px;
            background: rgba(15, 23, 42, 0.2);
            border-top: 1px solid var(--nova-glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pill-input-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid var(--nova-glass-border);
            transition: 0.4s;
        }

        .pill-input-container:focus-within {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--nova-primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .pill-input-container input {
            border: none;
            background: transparent;
            flex: 1;
            outline: none;
            font-size: 15px;
            color: var(--nova-text-nova);
        }

        .pill-input-container input::placeholder { color: var(--nova-text-muted); }

        .mic-btn-main {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--nova-primary), var(--nova-secondary));
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .mic-btn-main:hover { transform: scale(1.05) translateY(-2px); filter: brightness(1.1); }

        .mic-btn-main.listening {
            animation: pulseListening 1.5s infinite;
            background: #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
        }

        @keyframes pulseListening {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Botón de Activación (Nova Orb) */
        #triggerNova {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: var(--nova-dark);
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #triggerNova::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(from 0deg, var(--nova-primary), var(--nova-secondary), var(--nova-accent), var(--nova-primary));
            animation: spin 3s linear infinite;
            opacity: 0.8;
        }

        #triggerNova::after {
            content: '✨';
            position: absolute;
            width: 85%;
            height: 85%;
            background: var(--nova-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            z-index: 1;
        }

        #triggerNova:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.5);
        }

        #triggerNova:hover::after { background: #1e293b; }
    </style>

    <!-- Botón Flotante (Nova Orb) -->
    <button id="triggerNova" title="Asistente Nova"></button>

    <!-- Ventana del Asistente -->
    <div id="novaContainer" class="nova-window">
        <div class="nova-header">
            <div class="d-flex align-items-center gap-3">
                <div class="nova-avatar-box">✨</div>
                <div>
                    <h6 class="m-0 fw-bold" style="letter-spacing: 0.5px; color: var(--nova-text-nova);">NOVA CORE</h6>
                    <div class="d-flex align-items-center gap-2">
                        <span style="width: 8px; height: 8px; background: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #22c55e;"></span>
                        <small class="opacity-75">Sincronizado</small>
                    </div>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-link p-0 text-decoration-none" title="Borrar historial" style="color: var(--nova-text-muted); font-size: 14px;" onclick="novaApp.clearHistory()">
                    <i class="bi bi-trash3"></i>
                </button>
                <button type="button" class="btn-close" style="font-size: 12px; filter: var(--nova-close-filter);" onclick="novaApp.toggle()"></button>
            </div>
        </div>

        <div id="chatDisplay" class="nova-body">
            <!-- El indicador de tipeo siempre queda al fondo y se muestra via JS -->
            <div id="typingArea" class="typing-container">
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <div class="nova-footer">
            <div class="sound-wave" id="siriWave">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            
            <div class="pill-input-container">
                <input type="text" id="textInput" placeholder="Escribe o pulsa el micro...">
                <button class="btn btn-link p-0" onclick="novaApp.sendText()" style="text-decoration: none; color: var(--nova-accent);">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>

            <button id="micAction" class="mic-btn-main">
                <i class="bi bi-mic-fill"></i>
            </button>
            <div class="mt-3 text-muted fw-bold" style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--nova-text-muted);">
                Asistente de Voz Inteligente
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script th:inline="javascript">
    const novaApp = {
        config: {
            // Sintaxis segura: Thymeleaf reemplaza el comentario, JS usa 'Usuario' de respaldo
            user: /*[[${usuario?.nombre}]]*/ 'Usuario',
            userId: /*[[${usuario?.id}]]*/ null,
            
            // Mapeo de rutas corregido para coincidir con tu sistema
            routes: {
                'cita': '/usuario/citas/solicitar',
                'mis citas': '/usuario/mis-citas',
                'mascota': '/usuario/mis-mascotas', // CORREGIDO
                'mis mascotas': '/usuario/mis-mascotas',
                'pago': '/usuario/pagos',
                'juego': '/usuario/juego',
                'perfil': '/usuario/perfil'
            }
        },

        sr: null,
        isOpen: false,
        history: [],

        init() {
            // Cargar historial y estado previo al iniciar la página
            let storedHistory = sessionStorage.getItem('nova_history');
            if (storedHistory) {
                try {
                    let parsed = JSON.parse(storedHistory);
                    parsed.forEach(item => this.pushMsg(item.role, item.text, item.chips, false, item.time));
                    this.history = parsed;
                } catch(e) { console.error("Error cargando historial de Nova", e); }
            }
            
            if(sessionStorage.getItem('nova_isOpen') === 'true') {
                this.isOpen = false; // Se invertirá a true en toggle
                this.toggle(false);
            }

            // Configurar Reconocimiento de Voz (Web Speech API)
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (Speech) {
                this.sr = new Speech();
                this.sr.lang = 'es-ES';
                this.sr.continuous = false;
                this.sr.interimResults = false;
                
                this.sr.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    this.processInput(transcript);
                };
                
                this.sr.onstart = () => this.setVisualListening(true);
                this.sr.onend = () => this.setVisualListening(false);
                this.sr.onerror = () => this.setVisualListening(false);
            }

            // Eventos de botones
            document.getElementById('triggerNova').onclick = () => this.toggle();
            
            document.getElementById('micAction').onclick = () => {
                try { 
                    this.sr.start(); 
                } catch(e) { 
                    console.warn("El reconocimiento ya está activo"); 
                }
            };

            document.getElementById('textInput').onkeypress = (e) => { 
                if (e.key === 'Enter') this.sendText(); 
            };
        },

        // FUNCIÓN MEJORADA: Saludo e Introducción inmediata
        toggle(speakHello = true) {
            this.isOpen = !this.isOpen;
            sessionStorage.setItem('nova_isOpen', this.isOpen);
            const container = document.getElementById('novaContainer');
            container.style.display = this.isOpen ? 'flex' : 'none';
            
            // Si se abre y el chat está vacío, Nova se presenta
            if (this.isOpen && this.history.length === 0 && speakHello) {
                const saludoPrincipal = `¡Hola **${this.config.user}**! ✨ Soy **Nova**, tu asistente inteligente. 
                Mi propósito es ayudarte a cuidar de tus mascotas de la forma más rápida posible. 
                Puedo agendarte una cita, mostrarte tus pagos o llevarte al juego virtual. 
                ¿En qué puedo servirte ahora?`;
                
                this.pushMsg('nova', saludoPrincipal, ['📅 Agendar Cita', '🐾 Mis Mascotas', '💳 Ver Pagos', '🎮 Jugar']);
                this.speak(saludoPrincipal);
            }
        },

        setVisualListening(state) {
            const btn = document.getElementById('micAction');
            const wave = document.getElementById('siriWave');
            if (state) {
                btn.classList.add('listening');
                if(wave) wave.style.display = 'flex';
            } else {
                btn.classList.remove('listening');
                if(wave) wave.style.display = 'none';
            }
        },

        sendText() {
            const input = document.getElementById('textInput');
            const val = input.value.trim();
            if (!val) return;
            this.processInput(val);
            input.value = "";
        },

        async processInput(text) {
            if (!text) return;
            this.pushMsg('user', text);
            const lowerText = text.toLowerCase();
            
            // Mostrar animación de escribiendo
            this.showTyping(true);

            // 1. Prioridad: Consultar al Backend (Java)
            try {
                const response = await fetch('/api/nova-brain/think', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        mensaje: text, 
                        contexto: { 
                            user: this.config.user,
                            userId: this.config.userId
                        } 
                    })
                });
                
                // Simular un ligero retraso para que parezca que está "pensando" (más realista)
                setTimeout(async () => {
                    this.showTyping(false);
                    if(response.ok) {
                        const data = await response.json();
                        
                        this.pushMsg('nova', data.respuesta, data.sugerencias);
                        this.speak(data.respuesta);

                        // Si el servidor envía una URL de redirección
                        if (data.data && data.data.redirectUrl) {
                            setTimeout(() => this.pushMsg('nova', "🚀 **Redirigiendo ahora...**"), 800);
                            setTimeout(() => window.location.href = data.data.redirectUrl, 2500);
                        }

                    } else {
                        this.handleFallback(lowerText);
                    }
                }, 800); // 800ms artificial thinking delay

            } catch (e) {
                console.error("Error conectando con Nova Brain:", e);
                this.showTyping(false);
                this.handleFallback(lowerText);
            }
        },

        handleFallback(lowerText) {
            // 2. Fallback: Navegación Local si el servidor falla
            let matchedRoute = null;
            for (let key in this.config.routes) {
                if (lowerText.includes(key)) {
                    matchedRoute = this.config.routes[key];
                    break;
                }
            }

            if (matchedRoute) {
                const responseText = `Entendido. El sistema central no responde, pero conozco la ruta. Te llevo a **${lowerText}**...`;
                this.pushMsg('nova', responseText);
                this.speak(responseText);
                setTimeout(() => window.location.href = matchedRoute, 1500);
            } else {
                const fallbackMsg = "Lo siento, tuve un problema de conexión con mi núcleo lógico. ¿Podrías intentar de nuevo o elegir una sugerencia?";
                this.pushMsg('nova', fallbackMsg, ['📅 Citas', '🐾 Mascotas', '🎮 Juego']);
                this.speak(fallbackMsg);
            }
        },



        showTyping(show) {
            const typingArea = document.getElementById('typingArea');
            const chat = document.getElementById('chatDisplay');
            if (show) {
                typingArea.style.display = 'flex';
                typingArea.style.order = '9999'; // Mantener siempre de último
                chat.appendChild(typingArea); // Mover al final
            } else {
                typingArea.style.display = 'none';
            }
            chat.scrollTop = chat.scrollHeight;
        },

        pushMsg(role, text, chips = [], saveParam = true, pastTime = null, isHtml = false) {
            const chat = document.getElementById('chatDisplay');
            const typingArea = document.getElementById('typingArea');
            
            const div = document.createElement('div');
            div.className = `bubble bubble-${role}`;
            if(isHtml) div.style.width = '90%'; // Expanded for visual cards
            
            // Procesamiento de texto (Bold, Italic y emojis) si no es HTML puro
            let formattedText = text;
            if(!isHtml) {
                formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            }
            
            // Obtener hora actual
            const now = new Date();
            const timeString = pastTime || (now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0'));

            if(saveParam) {
                this.history.push({role: role, text: text, chips: chips, time: timeString});
                sessionStorage.setItem('nova_history', JSON.stringify(this.history));
            }

            div.innerHTML = `
                <div>${formattedText}</div>
                <div class="timestamp">${timeString}</div>
            `;
            
            chat.insertBefore(div, typingArea);

            // Añadir botones de sugerencias si existen
            if (chips && chips.length > 0) {
                const chipContainer = document.createElement('div');
                chipContainer.className = 'quick-actions';
                chips.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'nav-chip';
                    btn.innerText = c;
                    btn.onclick = () => this.processInput(c);
                    chipContainer.appendChild(btn);
                });
                chat.insertBefore(chipContainer, typingArea);
            }
            
            // Scroll automático al fondo
            setTimeout(() => {
                chat.scrollTop = chat.scrollHeight;
            }, 50);
        },

        speak(text) {
            if (!window.speechSynthesis) return;
            
            // Limpiar colas de voz anteriores
            window.speechSynthesis.cancel();
            
            // Limpiar el texto de caracteres especiales para que la voz sea fluida
            const cleanText = text.replace(/[*#_]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            utterance.pitch = 1.1; // Un tono ligeramente más tecnológico
            window.speechSynthesis.speak(utterance);
        },

        clearHistory() {
            if(confirm("¿Deseas borrar toda la conversación?")) {
                this.history = [];
                sessionStorage.removeItem('nova_history');
                const chat = document.getElementById('chatDisplay');
                const typingArea = document.getElementById('typingArea');
                
                // Animación de salida opcional
                chat.style.opacity = '0';
                setTimeout(() => {
                    chat.innerHTML = "";
                    chat.appendChild(typingArea);
                    chat.style.opacity = '1';
                    this.toggle(true); // Reinicia con el saludo
                }, 300);
            }
        }
    };

    // Llamarlo de inmediato porque ahora el script está al final del body
    novaApp.init();
</script>
</div>
