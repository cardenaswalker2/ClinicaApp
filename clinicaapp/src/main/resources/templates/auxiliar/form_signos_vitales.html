<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Signos Vitales | ClínicaApp</title>
    <link th:replace="~{fragments/header :: favIcon}">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0b0f19;
            --surface: #121824;
            --surface-card: #1f2a3c;
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f3f4f6;
            --text-secondary: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .navbar-custom {
            background: rgba(18, 24, 36, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            margin-bottom: 3rem;
        }

        .navbar-brand-custom {
            font-weight: 800;
            font-size: 1.25rem;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .navbar-brand-custom i {
            color: var(--primary);
        }

        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            max-width: 600px;
            margin: 0 auto 3rem auto;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title i {
            color: var(--primary);
        }

        .form-label {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1.5px solid var(--border);
            color: white;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .form-control:focus, .form-select:focus {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
            color: white;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            transition: var(--transition);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--border);
            color: var(--text);
            padding: 0.8rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-custom navbar-dark">
        <div class="container">
            <a class="navbar-brand-custom" href="#">
                <i class="bi bi-shield-plus"></i>
                ClínicaApp <span>Auxiliar Portal</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary fw-semibold" th:text="${'Sede: ' + clinica.nombre}">Clínica</span>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="form-card">
            <div class="section-title">
                <i class="bi bi-activity"></i> Signos Vitales y Estado
            </div>

            <p class="text-secondary mb-4">
                Registra los signos vitales actuales para <strong class="text-white" th:text="${mascota.nombre}">Mascota</strong>.
            </p>

            <form th:action="@{/auxiliar/mascotas/guardar-signos-vitales}" method="post">
                <input type="hidden" name="id" th:value="${mascota.id}">

                <!-- Estado Hospitalización -->
                <div class="mb-4">
                    <label for="estadoHospitalizacion" class="form-label">Estado de Hospitalización *</label>
                    <select id="estadoHospitalizacion" class="form-select" name="estadoHospitalizacion" required>
                        <option value="De Alta" th:selected="${mascota.estadoHospitalizacion == 'De Alta'}">De Alta (Normal)</option>
                        <option value="Hospitalizado" th:selected="${mascota.estadoHospitalizacion == 'Hospitalizado'}">Hospitalizado</option>
                    </select>
                </div>

                <!-- Temperatura -->
                <div class="mb-4">
                    <label for="temperatura" class="form-label">Temperatura Corporal (°C) *</label>
                    <input type="number" step="0.1" id="temperatura" class="form-control" name="temperatura" th:value="${mascota.temperatura}" required placeholder="Ej: 38.5">
                </div>

                <!-- Frecuencia Cardíaca -->
                <div class="mb-4">
                    <label for="frecuenciaCardiaca" class="form-label">Frecuencia Cardíaca (lpm) *</label>
                    <input type="number" id="frecuenciaCardiaca" class="form-control" name="frecuenciaCardiaca" th:value="${mascota.frecuenciaCardiaca}" required placeholder="Ej: 80">
                </div>

                <!-- Observaciones -->
                <div class="mb-4">
                    <label for="observacionesAuxiliar" class="form-label">Observaciones del Auxiliar</label>
                    <textarea id="observacionesAuxiliar" class="form-control" name="observacionesAuxiliar" th:text="${mascota.observacionesAuxiliar}" rows="3" placeholder="Estado general del paciente, ingesta de agua, comportamiento..."></textarea>
                </div>

                <!-- Botones de Acción -->
                <div class="d-flex justify-content-end gap-3 mt-5">
                    <a th:href="@{/auxiliar/dashboard}" class="btn-cancel">
                        Cancelar
                    </a>
                    <button type="submit" class="btn-submit">
                        Actualizar Paciente
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
